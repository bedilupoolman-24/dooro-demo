<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dooro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Dooro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --blue:#2D5BFF; --navy:#0E1A3A; --sky:#EAF0FF; --paper:#F6F8FF; --sun:#FFC83D; --mint:#6EDCC0; --love:#FF5C8A; --lilac:#C9B8FF;
  --mute:#5B6684; --ink2:#3F4A66; --line:rgba(14,26,58,.08);
  --tabh:calc(62px + env(safe-area-inset-bottom));
  --top:max(12px, env(safe-area-inset-top));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);overscroll-behavior:none}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:var(--navy);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.display{font-family:'Bricolage Grotesque',system-ui,sans-serif}
#app{position:fixed;inset:0;overflow:hidden}
.view{position:absolute;left:0;right:0;top:0;bottom:var(--tabh);display:none}
.view.active{display:block}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;height:var(--tabh);padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);z-index:50;transition:background .2s}
#tabs.dark{background:var(--navy);border-top:1px solid rgba(255,255,255,.08)}
#tabs.light{background:#fff;border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;position:relative}
#tabs.dark .tab{color:#9AA6C4}#tabs.light .tab{color:var(--mute)}
#tabs.dark .tab.on{color:#fff}#tabs.light .tab.on{color:var(--navy)}
.tab svg{width:24px;height:24px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--love);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* shared top controls */
.topbar{position:absolute;left:12px;right:12px;top:var(--top);display:flex;gap:8px;align-items:center;z-index:20}
.seg{display:flex;padding:3px;border-radius:999px;gap:2px}
.seg button{padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px}
.seg.dark{background:rgba(14,26,58,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.seg.dark button{color:#fff}
.seg.light{background:#fff;box-shadow:0 4px 14px rgba(14,26,58,.12)}
.seg button.on{background:var(--blue);color:#fff}
.pill{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:11px 13px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill.dark{background:rgba(14,26,58,.6);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pill.light{background:#fff;box-shadow:0 4px 14px rgba(14,26,58,.12)}
.round{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.round.dark{background:rgba(14,26,58,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.round.light{background:#fff;box-shadow:0 4px 14px rgba(14,26,58,.12)}

/* feed */
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:var(--navy)}
#feed::-webkit-scrollbar{display:none}
.card{position:relative;height:calc(100dvh - var(--tabh));scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#fff}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;overflow:hidden}
.slide svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.kenburns svg{animation:kb 9s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translateY(-10px)}}
.scrim-top{position:absolute;left:0;right:0;top:0;height:170px;background:linear-gradient(rgba(14,26,58,.55),rgba(14,26,58,0));pointer-events:none}
.scrim-bot{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(14,26,58,.94) 28%,rgba(14,26,58,0));pointer-events:none}
.segs{position:absolute;left:14px;right:14px;top:calc(var(--top) + 54px);display:flex;gap:4px;pointer-events:none}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.38);transition:background .2s}
.segs i.on{background:#fff}
.vchip{position:absolute;left:14px;top:calc(var(--top) + 54px);display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(14,26,58,.55);font-size:13px;font-weight:700}
.rail{position:absolute;right:10px;bottom:calc(150px + 7vh);display:flex;flex-direction:column;gap:14px;z-index:3}
.rail button{width:52px;height:52px;border-radius:50%;background:rgba(14,26,58,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.rail svg{width:26px;height:26px}
.info{position:absolute;left:14px;right:78px;bottom:18px;display:flex;flex-direction:column;gap:5px;z-index:3}
.label{align-self:flex-start;padding:5px 9px;border-radius:7px;color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.06em}
.price{display:flex;align-items:baseline;gap:8px}
.price b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:42px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:16px;color:#DCE4F7}
.addr{font-size:17px;font-weight:700}.addr span{font-weight:500;color:#DCE4F7}
.specs{font-size:15px;color:#DCE4F7}
.src{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.agent{display:flex;align-items:center;gap:8px;font-size:13px;color:#DCE4F7;min-width:0}
.agent span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:26px;height:26px;border-radius:50%;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.details{flex:none;padding:9px 15px;border-radius:999px;background:#fff;color:var(--navy);font-size:14px;font-weight:700}
.burst{position:absolute;left:50%;top:42%;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;opacity:0;z-index:4}
.burst.go{animation:burst .8s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.1)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25) translateY(-30px)}}
.hint{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);z-index:6;background:rgba(14,26,58,.82);color:#fff;border-radius:18px;padding:14px 18px;font-size:14px;line-height:1.5;text-align:center;width:min(300px,80%);transition:opacity .4s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hint.gone{opacity:0;pointer-events:none}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;color:#fff}
.empty h3{margin:0;font-family:'Bricolage Grotesque';font-size:26px}
.empty p{margin:0;color:#C7D0E6;line-height:1.5}
.btn{padding:14px 20px;border-radius:999px;font-weight:700;font-size:15px}
.btn.blue{background:var(--blue);color:#fff}.btn.white{background:#fff;color:var(--navy)}.btn.ghost{background:var(--sky);color:var(--navy)}

/* map */
#mapwrap{position:absolute;inset:0;background:#EEF2F8}
#map{position:absolute;inset:0}
#drawlayer{position:absolute;inset:0;z-index:10;touch-action:none;display:none}
#drawlayer.on{display:block}
.count{position:absolute;top:calc(var(--top) + 54px);left:0;right:0;display:flex;justify-content:center;z-index:20;pointer-events:none}
.count div{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(14,26,58,.2)}
.count i{width:8px;height:8px;border-radius:50%;background:var(--sun)}
.count u{text-decoration:none;color:var(--sun)}
.fabs{position:absolute;right:12px;top:calc(var(--top) + 100px);display:flex;flex-direction:column;gap:10px;z-index:20}
.fab{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(14,26,58,.18);display:flex;align-items:center;justify-content:center}
.fab.on{background:var(--blue)}
.fab svg{width:25px;height:25px}
.drawhint{position:absolute;left:12px;right:12px;bottom:16px;z-index:20;background:var(--blue);color:#fff;border-radius:18px;padding:14px 16px;font-weight:700;display:none;align-items:center;justify-content:space-between;gap:10px}
.drawhint.on{display:flex}
.pin{padding:7px 11px;border-radius:999px;background:var(--navy);color:#fff;font:700 14px 'Bricolage Grotesque',sans-serif;box-shadow:0 4px 10px rgba(14,26,58,.25);white-space:nowrap;cursor:pointer;transition:transform .15s}
.pin.dim{background:#fff;color:var(--mute);box-shadow:0 0 0 1px rgba(14,26,58,.14)}
.pin.sel{background:var(--blue);color:#fff;transform:scale(1.12);z-index:5}
.pin.saved::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--love);margin-left:6px;vertical-align:middle}
.peek{position:absolute;left:10px;right:10px;bottom:12px;z-index:20;background:#fff;border-radius:24px;padding:12px;box-shadow:0 10px 30px rgba(14,26,58,.2);display:none;gap:12px;align-items:center}
.peek.on{display:flex}
.thumb{flex:none;width:88px;height:88px;border-radius:16px;overflow:hidden;position:relative}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.peek .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.peek .p{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;letter-spacing:-.02em}
.peek .p small{font-size:13px;font-weight:600;color:var(--mute);margin-left:4px}
.peek .a{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek .s{font-size:13px;color:var(--ink2)}
.go{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
.maplibregl-ctrl-attrib{font-size:10px}

/* light pages */
.page{position:absolute;inset:0;overflow-y:auto;background:var(--paper);padding:calc(var(--top) + 8px) 16px 24px}
.page h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;letter-spacing:-.02em;margin:6px 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mini{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--line);text-align:left}
.mini .im{height:150px;position:relative;overflow:hidden}
.mini .im svg{position:absolute;inset:0;width:100%;height:100%}
.mini .tx{padding:10px 12px 12px}
.mini b{font-family:'Bricolage Grotesque';font-size:19px}
.mini div{font-size:13px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{background:#fff;border-radius:20px;padding:16px;box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:16px}
.box p{margin:0;color:var(--ink2);line-height:1.5;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-of-type{border-top:0}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(14,26,58,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(14,26,58,.18);margin:0 auto 14px}
.sheet h2{font-family:'Bricolage Grotesque';font-size:24px;margin:0 0 14px}
.field{margin-bottom:18px}
.field label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.field label span{color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(14,26,58,.14);font-weight:700;font-size:14px}
.chip.on{background:var(--navy);color:#fff;box-shadow:none}
.menu button{display:flex;width:100%;align-items:center;gap:12px;padding:14px 4px;font-size:16px;font-weight:600;border-top:1px solid var(--line)}
.menu button:first-child{border-top:0}

/* detail */
#detail{position:fixed;inset:0;z-index:70;background:var(--paper);transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.25,1);overflow:hidden}
#detail.on{transform:none}
#dscroll{position:absolute;inset:0;bottom:calc(84px + env(safe-area-inset-bottom));overflow-y:auto}
.dmedia{position:relative;height:56vh;max-height:470px}
.dmedia .slides{position:absolute;inset:0}
.dtop{position:absolute;left:14px;right:14px;top:var(--top);display:flex;justify-content:space-between;z-index:3}
.dtop button{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(14,26,58,.15);display:flex;align-items:center;justify-content:center}
.dcount{position:absolute;right:14px;bottom:40px;padding:6px 11px;border-radius:999px;background:rgba(14,26,58,.7);color:#fff;font-size:12px;font-weight:700;z-index:3}
.dbody{position:relative;margin-top:-26px;border-radius:26px 26px 0 0;background:var(--paper);padding:22px 18px 30px;display:flex;flex-direction:column;gap:22px}
.dbody .price b{font-size:44px}.dbody .price small{color:var(--ink2)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:#fff;border-radius:16px;padding:12px;box-shadow:0 0 0 1px var(--line)}
.fact div{font-size:12px;color:var(--mute)}.fact b{display:block;font-size:16px;margin-top:2px}
.dbody h4{font-family:'Bricolage Grotesque';font-size:22px;margin:0 0 8px}
.dbody p{margin:0;font-size:15px;line-height:1.55;color:#26304A}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.dbar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px}
.dbar .save{flex:none;width:56px;height:56px;border-radius:50%;background:#EEF2F8;display:flex;align-items:center;justify-content:center}
.dbar .save.on{background:var(--love)}
.dbar .cta{flex:1;height:56px;border-radius:999px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px}

#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px);transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:90;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">

  <section class="view active" id="v-feed">
    <div id="feed"></div>
    <div class="topbar">
      <div class="seg dark" data-seg></div>
      <button class="pill dark" data-open-filters><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 19C3 12 9 4 15 6s5 10-2 12z"/></svg><span data-pilltext></span></button>
      <button class="round dark" data-open-filters aria-label="Filters"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="hint" id="hint">Swipe <b>up</b> for the next home<br>swipe <b>sideways</b> for photos<br><b>double-tap</b> to save ♥</div>
  </section>

  <section class="view" id="v-map">
    <div id="mapwrap"><div id="map"></div><canvas id="drawlayer"></canvas></div>
    <div class="topbar">
      <div class="seg light" data-seg></div>
      <button class="pill light" data-open-filters><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E1A3A" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span data-pilltext></span></button>
      <button class="round light" data-open-filters aria-label="Filters"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E1A3A" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="count"><div id="countchip"></div></div>
    <div class="fabs">
      <button class="fab" id="drawbtn" aria-label="Draw your area"><svg viewBox="0 0 24 24" fill="none" stroke="#0E1A3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c2-4 4-9 8-9s2 7 5 7 3-3 3-3"/><path d="M3 21h18"/></svg></button>
      <button class="fab" id="clearbtn" aria-label="Clear drawn areas" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="#0E1A3A" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawhint" id="drawhint"><span>Draw around the area you want to live in</span><button class="btn white" id="canceldraw" style="padding:8px 14px">Cancel</button></div>
    <div class="peek" id="peek"></div>
  </section>

  <section class="view" id="v-saved"><div class="page" id="savedpage"></div></section>
  <section class="view" id="v-profile"><div class="page" id="profilepage"></div></section>

  <nav id="tabs" class="dark">
    <button class="tab on" data-tab="feed"><svg viewBox="0 0 24 24"><path d="M5 23V11a7 7 0 0 1 14 0v12z" fill="currentColor"/><circle cx="15.5" cy="16" r="1.5" fill="#0E1A3A"/></svg>Feed</button>
    <button class="tab" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg>Map</button>
    <button class="tab" data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.5-9.2C1.2 8.1 3.3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.5 0 5.6 3.6 4.3 6.8-2 4.6-9.5 9.2-9.5 9.2z"/></svg>Saved<span class="badge" id="savedbadge" style="display:none"></span></button>
    <button class="tab" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
  </nav>
</div>

<div class="veil" id="veil"></div>
<div class="sheet" id="filters"></div>
<div class="sheet" id="more"></div>
<div id="detail"></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- demo data (fictional homes, real Amsterdam streets) ---------- */
const PAL = [
  {sky:'#BFE0FF',wall:'#F6E7D8',floor:'#D9A27A',sofa:'#C9B8FF',facade:'#E2725B',cab:'#9BE3C3',n1:'#F1D3A8',n2:'#6F86C9'},

/* ---------- state (persisted per device) ---------- */
const store = {get(k,d){try{const v=localStorage.getItem('dooro.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('dooro.'+k,JSON.stringify(v))}catch(e){}}};
const S = {
  mode: store.get('mode','rent'),
  max: store.get('max',{rent:3000,buy:900000}),
  beds: store.get('beds',0),
  areas: store.get('areas',[]),
  saved: new Set(store.get('saved',[])),
  hidden: new Set(store.get('hidden',[])),
  tab: 'feed', selected: null, drawing: false, photo: {}
};
const persist = () => {store.set('mode',S.mode);store.set('max',S.max);store.set('beds',S.beds);store.set('areas',S.areas);store.set('saved',[...S.saved]);store.set('hidden',[...S.hidden]);};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const fmt = h => h.mode==='rent' ? '€'+h.price.toLocaleString('en-US') : (h.price>=1e6 ? '€'+(h.price/1e6).toFixed(2)+'M' : '€'+h.price.toLocaleString('en-US'));
const short = h => h.mode==='rent' ? '€'+h.price.toLocaleString('en-US') : '€'+Math.round(h.price/1000)+'k';
const unit = h => h.mode==='rent' ? '/month' : 'asking price';
const spec = h => `${h.bed} bedroom${h.bed>1?'s':''} · ${h.m2} m² · ${h.type}`;
function pip(pt, poly){let x=pt[0],y=pt[1],inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
const inAreas = h => S.areas.length===0 || S.areas.some(a=>pip([h.lng,h.lat],a));
const matches = h => h.mode===S.mode && h.price<=S.max[S.mode] && h.bed>=S.beds && !S.hidden.has(h.id);
const results = () => HOMES.filter(h=>matches(h)&&inAreas(h));
let toastT; function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}

function renderShared(){
  $$('[data-seg]').forEach(el=>{
    el.innerHTML=['rent','buy'].map(m=>`<button data-mode="${m}" class="${S.mode===m?'on':''}">${m==='rent'?'Rent':'Buy'}</button>`).join('');
  });
  const area = S.areas.length ? `${S.areas.length} area${S.areas.length>1?'s':''}` : 'Amsterdam';
  const cap = S.mode==='rent' ? '€'+(S.max.rent/1000).toFixed(2).replace(/\.?0+$/,'')+'k' : '€'+Math.round(S.max.buy/1000)+'k';
  $$('[data-pilltext]').forEach(el=>el.textContent=`${area} · ≤ ${cap}`);
  const n=S.saved.size, b=$('#savedbadge'); b.style.display=n?'flex':'none'; b.textContent=n;
}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-mode]'); if(m){S.mode=m.dataset.mode;persist();refresh();return;}
  if(e.target.closest('[data-open-filters]')){openFilters();return;}
  const t=e.target.closest('[data-tab]'); if(t){go(t.dataset.tab);return;}
});

let feedObs;
function renderFeed(){
  const list=results(), feed=$('#feed');
  if(!list.length){
    feed.innerHTML=`<div class="empty"><h3>No homes here yet</h3><p>Nothing matches ${S.areas.length?'inside your drawn area':'these filters'} right now.</p>${S.areas.length?'<button class="btn white" data-act="clearareas">Clear drawn areas</button>':''}<button class="btn blue" data-act="openfilters">Change filters</button></div>`;
    return;
  }
  feed.innerHTML=list.map(h=>{
    const lab=h.label?`<div class="label" style="background:${LABELS[h.label]}">${h.label}</div>`:'';
    const slides=h.kinds.map(k=>`<div class="slide${h.video?' kenburns':''}">${art(k,h.pal)}</div>`).join('');
    const top=h.video?`<div class="vchip"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg>Video tour</div>`:(h.kinds.length>1?`<div class="segs">${h.kinds.map((k,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:'');
    const sv=S.saved.has(h.id);
    return `<article class="card" data-id="${h.id}">
      <div class="slides" data-slides>${slides}</div>
      <div class="scrim-top"></div><div class="scrim-bot"></div>${top}
      <svg class="burst" viewBox="0 0 24 24" fill="#FF5C8A"><path d="M12 20.5s-7.5-4.6-9.5-9.2C1.2 8.1 3.3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.5 0 5.6 3.6 4.3 6.8-2 4.6-9.5 9.2-9.5 9.2z"/></svg>
      <div class="rail">
        <button data-act="save" aria-label="Save">${ICON.heart(sv?'#FF5C8A':'none',sv?'#FF5C8A':'#fff')}</button>
        <button data-act="share" aria-label="Share">${ICON.share('#fff')}</button>
        <button data-act="more" aria-label="More">${ICON.more('#fff')}</button>
      </div>
      <div class="info">${lab}
        <div class="price"><b>${fmt(h)}</b><small>${unit(h)}</small></div>
        <div class="addr">${h.street} · <span>${h.area}</span></div>
        <div class="specs">${spec(h)}</div>
        <div class="src"><div class="agent"><div class="av" style="background:${h.agent.bg}">${h.agent.ini}</div><span>Listed by ${h.agent.name}</span></div><button class="details" data-act="detail">Details</button></div>
      </div></article>`;
  }).join('');
  $$('#feed [data-slides]').forEach(sl=>sl.addEventListener('scroll',()=>{
    const i=Math.round(sl.scrollLeft/sl.clientWidth); const segs=sl.parentElement.querySelectorAll('.segs i');
    segs.forEach((s,j)=>s.classList.toggle('on',j===i));
  },{passive:true}));
}
$('#feed').addEventListener('scroll',()=>{$('#hint').classList.add('gone');},{passive:true,once:true});
setTimeout(()=>$('#hint').classList.add('gone'),6000);

let lastTap={t:0,id:null};
$('#feed').addEventListener('click',e=>{
  const card=e.target.closest('.card'); const actEl=e.target.closest('[data-act]');
  if(actEl){const a=actEl.dataset.act;
    if(a==='clearareas'){S.areas=[];persist();refresh();return;}
    if(a==='openfilters'){openFilters();return;}
    const h=byId[card.dataset.id];
    if(a==='save'){toggleSave(h.id);return;}
    if(a==='share'){share(h);return;}
    if(a==='more'){openMore(h);return;}
    if(a==='detail'){openDetail(h);return;}
    return;
  }
  if(!card)return;
  const now=Date.now();
  if(now-lastTap.t<320&&lastTap.id===card.dataset.id){
    if(!S.saved.has(card.dataset.id))toggleSave(card.dataset.id);
    const b=card.querySelector('.burst');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');
    lastTap={t:0,id:null};
  } else lastTap={t:now,id:card.dataset.id};
});

function toggleSave(id){
  if(S.saved.has(id)){S.saved.delete(id);toast('Removed from saved');}else{S.saved.add(id);toast('Saved ♥');vibrate();}
  persist();
  $$(`.card[data-id="${id}"] [data-act="save"]`).forEach(b=>{const on=S.saved.has(id);b.innerHTML=ICON.heart(on?'#FF5C8A':'none',on?'#FF5C8A':'#fff');});
  renderShared(); if(S.tab==='saved')renderSaved(); if(mapReady)renderPins(); if($('#detail').classList.contains('on'))syncDetailSave(id);
}
function share(h){
  const text=`${fmt(h)} ${unit(h)} · ${h.street}, ${h.area} (Dooro demo)`;
  if(navigator.share){navigator.share({title:'Dooro',text}).catch(()=>{});} else {try{navigator.clipboard.writeText(text);toast('Copied to clipboard');}catch(e){toast(text);}}
}

function openFilters(){
  const rent=S.mode==='rent';
  const min=rent?1000:250000,max=rent?4000:1500000,step=rent?50:25000,val=S.max[S.mode];
  const lbl=v=>rent?'€'+(+v).toLocaleString('en-US')+' /month':'€'+Math.round(v/1000)+'k';
  $('#filters').innerHTML=`<div class="grab"></div><h2>Filters</h2>
    <div class="field"><label>Looking to</label><div class="chips">${['rent','buy'].map(m=>`<button class="chip ${S.mode===m?'on':''}" data-fmode="${m}">${m==='rent'?'Rent':'Buy'}</button>`).join('')}</div></div>
    <div class="field"><label>${rent?'Max rent':'Max price'} <span id="maxv">${lbl(val)}</span></label><input type="range" id="maxr" min="${min}" max="${max}" step="${step}" value="${val}"></div>
    <div class="field"><label>Bedrooms</label><div class="chips">${[0,1,2,3].map(b=>`<button class="chip ${S.beds===b?'on':''}" data-beds="${b}">${b?b+'+':'Any'}</button>`).join('')}</div></div>
    <button class="btn blue" style="width:100%" id="applyf">Show ${results().length} homes</button>`;
  const upd=()=>{$('#applyf').textContent=`Show ${results().length} homes`;};
  $('#maxr').addEventListener('input',e=>{S.max[S.mode]=+e.target.value;$('#maxv').textContent=lbl(e.target.value);upd();});
  $('#filters').onclick=e=>{
    const fm=e.target.closest('[data-fmode]'); if(fm){S.mode=fm.dataset.fmode;persist();refresh();openFilters();return;}
    const bd=e.target.closest('[data-beds]'); if(bd){S.beds=+bd.dataset.beds;$$('[data-beds]').forEach(c=>c.classList.toggle('on',c===bd));upd();return;}
    if(e.target.id==='applyf'){persist();refresh();closeSheets();}
  };
  openSheet('filters');
}
function openMore(h){
  $('#more').innerHTML=`<div class="grab"></div><div class="menu">
    <button data-m="hide"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1A3A" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.2 2.3-2.4 3.5M6.6 6.6C4.4 8 2.7 10.2 2 12c1 2.5 5 7 10 7 1.6 0 3.1-.4 4.4-1.1"/></svg>Hide this home</button>
    <button data-m="report"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>Report: no longer available</button>
    <button data-m="report"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1A3A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>Report: wrong price or details</button>
  </div>`;
  $('#more').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;closeSheets();
    if(b.dataset.m==='hide'){S.hidden.add(h.id);persist();refresh();toast('Hidden. You won\'t see this home again');}
    else toast('Thanks, we\'ll check it with the agent');};
  openSheet('more');
}

/* ---------- detail ---------- */
let detailId=null;
function openDetail(h){
  detailId=h.id; const sv=S.saved.has(h.id);
  $('#detail').innerHTML=`<div id="dscroll">
    <div class="dmedia"><div class="slides" id="dslides">${h.kinds.map(k=>`<div class="slide${h.video?' kenburns':''}">${art(k,h.pal)}</div>`).join('')}</div>
      <div class="dtop"><button id="dclose" aria-label="Close">${ICON.back}</button><button id="dshare" aria-label="Share">${ICON.share('#0E1A3A')}</button></div>
      <div class="dcount" id="dcount">${h.video?'Video tour':'1 / '+h.kinds.length+' photos'}</div></div>
    <div class="dbody">
      <div style="display:flex;flex-direction:column;gap:8px">
        ${h.label?`<div style="display:flex;gap:10px;align-items:center"><div class="label" style="background:${LABELS[h.label]}">${h.label}</div><span class="note" style="margin:0">Checked on the agent's feed 12 min ago</span></div>`:''}
        <div class="price"><b>${fmt(h)}</b><small>${h.mode==='rent'?'/month · excl. service costs':'asking price · k.k.'}</small></div>
        <div style="font-size:17px;font-weight:700">${h.street} · <span style="font-weight:500;color:#3F4A66">${h.area}, Amsterdam</span></div>
      </div>
      <div class="facts">
        <div class="fact"><div>Bedrooms</div><b>${h.bed}</b></div><div class="fact"><div>Surface</div><b>${h.m2} m²</b></div><div class="fact"><div>Type</div><b>${h.type.split(' ')[0]}</b></div>
        <div class="fact"><div>${h.mode==='rent'?'Available':'Built'}</div><b>${h.mode==='rent'?'1 Dec':'1930'}</b></div><div class="fact"><div>${h.mode==='rent'?'Interior':'Outdoor'}</div><b>${h.mode==='rent'?'Upholstered':'Balcony'}</b></div><div class="fact"><div>Energy</div><b><span style="padding:1px 8px;border-radius:6px;background:#14B87A;color:#0E1A3A">A</span></b></div>
      </div>
      <div><h4>About this home</h4><p>${h.about}</p><div class="note">Description by ${h.agent.name}</div></div>
      <div><h4>Where it is</h4><div id="dmap" style="height:170px;border-radius:20px;overflow:hidden;background:#EEF2F8"></div></div>
      <div class="box" style="margin:0"><div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><div class="av" style="width:40px;height:40px;font-size:13px;background:${h.agent.bg}">${h.agent.ini}</div><div><div style="font-weight:700">Listed by ${h.agent.name}</div><div class="note" style="margin:0">Shared with Dooro through the agent's own system</div></div></div><p>Dooro is not the agent. Viewings and questions go through the original listing.</p></div>
      <div class="note" style="text-align:center">Demo app: fictional homes, illustrations instead of photos.</div>
    </div></div>
    <div class="dbar"><button class="save ${sv?'on':''}" id="dsave" aria-label="Save">${ICON.heart(sv?'#fff':'none',sv?'#fff':'#0E1A3A').replace('<svg','<svg width="24" height="24"')}</button><button class="cta" id="dcta">View original listing ${ICON.ext}</button></div>`;
  $('#detail').classList.add('on');
  $('#dclose').onclick=closeDetail; $('#dshare').onclick=()=>share(h);
  $('#dsave').onclick=()=>toggleSave(h.id);
  $('#dcta').onclick=()=>toast(`Demo: this opens ${h.agent.name}'s own listing`);
  const ds=$('#dslides'); ds.addEventListener('scroll',()=>{if(!h.video)$('#dcount').textContent=`${Math.round(ds.scrollLeft/ds.clientWidth)+1} / ${h.kinds.length} photos`;},{passive:true});
  setTimeout(()=>{ if(window.maplibregl){ try{ const m=new maplibregl.Map({container:'dmap',style:STYLE,center:[h.lng,h.lat],zoom:14.5,interactive:false,attributionControl:false}); const el=document.createElement('div');el.className='pin sel';el.textContent=short(h); new maplibregl.Marker({element:el}).setLngLat([h.lng,h.lat]).addTo(m);}catch(e){} } },350);
}
function syncDetailSave(id){if(id!==detailId)return;const on=S.saved.has(id),b=$('#dsave');if(!b)return;b.classList.toggle('on',on);b.innerHTML=ICON.heart(on?'#fff':'none',on?'#fff':'#0E1A3A').replace('<svg','<svg width="24" height="24"');}
function closeDetail(){$('#detail').classList.remove('on');detailId=null;}

/* ---------- map + draw your area ---------- */
const STYLE='https://tiles.openfreemap.org/styles/positron';
let map=null,mapReady=false,markers=[];
function initMap(){
  if(map||!window.maplibregl){ if(!window.maplibregl) $('#map').innerHTML='<div class="empty" style="color:#0E1A3A"><h3>Map needs internet</h3><p>Connect and reopen the Map tab.</p></div>'; return; }
  map=new maplibregl.Map({container:'map',style:STYLE,center:[4.886,52.366],zoom:12.3,attributionControl:{compact:true},pitchWithRotate:false,dragRotate:false});
  map.touchZoomRotate.disableRotation();
  map.on('load',()=>{
    map.addSource('areas',{type:'geojson',data:areasGeo()});
    map.addLayer({id:'areas-fill',type:'fill',source:'areas',paint:{'fill-color':'#2D5BFF','fill-opacity':.14}});
    map.addLayer({id:'areas-line',type:'line',source:'areas',paint:{'line-color':'#2D5BFF','line-width':3.5},layout:{'line-join':'round'}});
    mapReady=true; renderPins(); renderMapUi();
  });
  map.on('click',e=>{ if(!e.originalEvent.target.closest('.pin')){S.selected=null;renderPins();renderPeek();} });
}
const areasGeo=()=>({type:'FeatureCollection',features:S.areas.map(a=>({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[[...a,a[0]]]}}))});
function renderPins(){
  if(!mapReady)return;
  markers.forEach(m=>m.remove()); markers=[];
  HOMES.filter(matches).forEach(h=>{
    const inside=inAreas(h), el=document.createElement('div');
    el.className='pin'+(S.areas.length&&!inside?' dim':'')+(S.selected===h.id?' sel':'')+(S.saved.has(h.id)?' saved':'');
    el.textContent=short(h);
    el.addEventListener('click',ev=>{ev.stopPropagation();S.selected=h.id;renderPins();renderPeek();});
    markers.push(new maplibregl.Marker({element:el}).setLngLat([h.lng,h.lat]).addTo(map));
  });
  if(map.getSource('areas'))map.getSource('areas').setData(areasGeo());
  renderMapUi();
}
function renderMapUi(){
  const n=results().length;
  $('#countchip').innerHTML=`<i></i>${S.areas.length?`${n} home${n===1?'':'s'} in your area${S.areas.length>1?'s':''}`:`${n} homes · draw your area`}${S.areas.length&&n?' · <u data-tab="feed">See in feed</u>':''}`;
  $('#clearbtn').style.display=S.areas.length?'flex':'none';
}
function renderPeek(){
  const p=$('#peek'),h=S.selected&&byId[S.selected];
  if(!h){p.classList.remove('on');return;}
  p.innerHTML=`<div class="thumb">${art('exterior',h.pal)}</div><div class="t"><div class="p">${fmt(h)}<small>${unit(h)}</small></div><div class="a">${h.street} · ${h.area}</div><div class="s">${spec(h)}</div><div class="note" style="margin:0">Listed by ${h.agent.name}</div></div><button class="go" aria-label="Open home">${ICON.chev}</button>`;
  p.classList.add('on'); p.onclick=()=>openDetail(h);
}
/* freehand drawing on a canvas over the map */
const cv=$('#drawlayer'); let ctx, pts=[], down=false;
function setDrawing(on){
  S.drawing=on; cv.classList.toggle('on',on); $('#drawbtn').classList.toggle('on',on);
  $('#drawbtn svg').setAttribute('stroke',on?'#fff':'#0E1A3A');
  $('#drawhint').classList.toggle('on',on); $('#peek').classList.remove('on');
  if(on){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx=cv.getContext('2d');ctx.scale(d,d);ctx.clearRect(0,0,r.width,r.height);}
}
$('#drawbtn').onclick=()=>setDrawing(!S.drawing);
$('#canceldraw').onclick=()=>setDrawing(false);
$('#clearbtn').onclick=()=>{S.areas=[];persist();refresh();toast('Drawn areas cleared');};
cv.addEventListener('pointerdown',e=>{down=true;pts=[[e.offsetX,e.offsetY]];cv.setPointerCapture(e.pointerId);
  ctx.strokeStyle='#2D5BFF';ctx.lineWidth=4;ctx.lineJoin='round';ctx.lineCap='round';ctx.fillStyle='rgba(45,91,255,.14)';});
cv.addEventListener('pointermove',e=>{if(!down)return;const p=[e.offsetX,e.offsetY],l=pts[pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<4)return;
  pts.push(p);ctx.clearRect(0,0,cv.width,cv.height);ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();ctx.stroke();});
cv.addEventListener('pointerup',finishDraw); cv.addEventListener('pointercancel',finishDraw);
function finishDraw(){
  if(!down)return; down=false;
  if(pts.length<8){toast('Draw a bigger shape around an area');ctx.clearRect(0,0,cv.width,cv.height);return;}
  const step=Math.max(1,Math.floor(pts.length/60));
  const ring=pts.filter((_,i)=>i%step===0).map(p=>{const ll=map.unproject(p);return [+ll.lng.toFixed(5),+ll.lat.toFixed(5)];});
  S.areas.push(ring); persist(); setDrawing(false); refresh(); vibrate();
  const n=results().length; toast(`${n} home${n===1?'':'s'} inside your area`);
}

/* ---------- saved + profile ---------- */
function renderSaved(){
  const list=[...S.saved].map(id=>byId[id]).filter(Boolean);
  $('#savedpage').innerHTML=`<h1>Saved</h1>`+(list.length?`<div class="grid">${list.map(h=>`<button class="mini" data-open="${h.id}"><div class="im">${art(h.kinds[0],h.pal)}</div><div class="tx"><b>${fmt(h)}</b><div>${h.street} · ${h.area}</div><div>${h.mode==='rent'?'For rent':'For sale'} · ${h.bed} bd · ${h.m2} m²</div></div></button>`).join('')}</div>`
    :`<div class="box" style="text-align:center;padding:36px 20px"><h3 style="font-family:'Bricolage Grotesque';font-size:22px">Nothing saved yet</h3><p>Double-tap a home in the feed, or tap the heart.</p><button class="btn blue" style="margin-top:14px" data-tab="feed">Go to feed</button></div>`);
  $$('#savedpage [data-open]').forEach(b=>b.onclick=()=>openDetail(byId[b.dataset.open]));
}
function renderProfile(){
  $('#profilepage').innerHTML=`<h1>Profile</h1>
    <div class="box"><div style="display:flex;gap:12px;align-items:center"><div style="width:52px;height:52px;border-radius:16px;background:#2D5BFF;display:flex;align-items:flex-end;justify-content:center"><div style="width:22px;height:33px;background:#fff;border-radius:11px 11px 2px 2px;margin-bottom:9px"></div></div><div><h3 style="margin:0">Dooro demo</h3><p>Fictional homes on real Amsterdam streets. Illustrations stand in for the agents' photos.</p></div></div></div>
    <div class="box"><h3>Your search</h3>
      <div class="row"><span>Looking to</span><b>${S.mode==='rent'?'Rent':'Buy'}</b></div>
      <div class="row"><span>Budget</span><b>up to ${S.mode==='rent'?'€'+S.max.rent.toLocaleString('en-US')+' /month':'€'+Math.round(S.max.buy/1000)+'k'}</b></div>
      <div class="row"><span>Drawn areas</span><b>${S.areas.length||'None'}</b></div>
      <div class="row"><span>Saved homes</span><b>${S.saved.size}</b></div>
      <div class="row"><span>Hidden homes</span><b>${S.hidden.size}</b></div>
    </div>
    <div class="box"><h3>New home alerts</h3><p>Coming soon: a push the moment a home lands inside your drawn area.</p></div>
    <button class="btn ghost" style="width:100%" id="resetdemo">Reset demo</button>`;
  $('#resetdemo').onclick=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('dooro.')).forEach(k=>localStorage.removeItem(k));}catch(e){} location.reload();};
}

/* ---------- navigation ---------- */
function go(tab){
  S.tab=tab; closeSheets(); closeDetail(); if(S.drawing)setDrawing(false);
  $$('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+tab));
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  $('#tabs').className=tab==='feed'?'dark':'light';
  document.querySelector('meta[name=theme-color]').content=tab==='feed'?'#0E1A3A':'#F6F8FF';
  if(tab==='map'){initMap(); if(map)setTimeout(()=>map.resize(),30);}
  if(tab==='saved')renderSaved();
  if(tab==='profile')renderProfile();
  if(tab==='feed')$('#feed').scrollTop=0;
}
function refresh(){renderShared();renderFeed();if(mapReady)renderPins();if(S.tab==='saved')renderSaved();if(S.tab==='profile')renderProfile();}

refresh();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
