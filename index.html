<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash/1284x2778.png">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="homes.js"></script>
<style>
:root{
  --blue:#2D5BFF; --blue2:#1E46E0; --navy:#0E1A3A; --sky:#EAF0FF; --paper:#F6F8FF; --sun:#FFC83D; --mint:#6EDCC0; --love:#FF5C8A; --lilac:#C9B8FF;
  --mute:#5B6684; --ink2:#3F4A66; --line:rgba(14,26,58,.08);
  --top:max(12px, env(safe-area-inset-top));
  --tabspace:calc(86px + env(safe-area-inset-bottom));
  --shadow:0 6px 22px rgba(14,26,58,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#5C7AD6;overscroll-behavior:none}
html.fixh body{height:var(--appH);transform:translateZ(0)}
#splash{position:fixed;inset:0;z-index:300;background:#2D5BFF;display:flex;flex-direction:column;align-items:center;transition:opacity .4s ease;color:#fff}
#splash.out{opacity:0;pointer-events:none}
#splash .door{position:absolute;left:50%;top:46%;width:20vw;max-width:110px;transform:translate(-50%,-50%);animation:sp-in .55s cubic-bezier(.2,.9,.25,1) both}
#splash .word{position:absolute;left:0;right:0;top:calc(46% + 20vw*0.745 + 22px);text-align:center;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;animation:sp-fade .6s .25s ease both}
#splash .from{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));text-align:center;font-size:13px;font-weight:600;opacity:.7;letter-spacing:.02em;animation:sp-fade .6s .35s ease both}
@keyframes sp-in{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes sp-fade{from{opacity:0}to{opacity:1}}

body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:var(--navy);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
#app{position:fixed;inset:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}

/* ---------- header: search bar + filter chips ---------- */
.hdr{position:absolute;left:0;right:0;top:0;padding:var(--top) 14px 0;z-index:30;pointer-events:none}
.hdr>*{pointer-events:auto}
.searchrow{display:flex;gap:10px;align-items:center}
.search{flex:1;min-width:0;height:52px;border-radius:26px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;font-size:17px;font-weight:600}
.search .loc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search .clr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center}
.filterbtn{flex:none;position:relative;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.cnt{position:absolute;top:-3px;right:-3px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -14px 0;padding:2px 14px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:20px;background:rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(14,26,58,.12);font-weight:700;font-size:14px;white-space:nowrap}
.fchip.on{box-shadow:inset 0 0 0 2px var(--blue),0 2px 10px rgba(14,26,58,.12);padding-left:6px}
.fchip .xx{width:24px;height:24px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center}
.fchip svg.chev{opacity:.8}

/* ---------- floating tab bar ---------- */
#tabs{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));height:66px;border-radius:33px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:50;-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);transition:background .25s}
#tabs.light{background:rgba(255,255,255,.8);box-shadow:0 10px 30px rgba(14,26,58,.16),inset 0 0 0 1px rgba(255,255,255,.7)}
#tabs.dark{background:rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(30,60,140,.28),inset 0 0 0 1px rgba(255,255,255,.35)}
.tab{border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;position:relative;transition:background .2s}
.tab svg{width:24px;height:24px}
#tabs.light .tab{color:var(--ink2)}#tabs.light .tab.on{background:var(--sky);color:var(--blue)}
#tabs.dark .tab{color:rgba(255,255,255,.72)}#tabs.dark .tab.on{background:rgba(255,255,255,.16);color:#fff}
.badge{position:absolute;top:4px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--love);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ---------- photos, dots, chips ---------- */
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;overflow:hidden;background:#C9D3E6}
.slide svg,.slide img,.thumb svg,.thumb img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.kenburns svg,.kenburns img{animation:kb 9s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translateY(-10px)}}
.dots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;padding:7px 11px;border-radius:999px;background:rgba(14,26,58,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none;z-index:3}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);transition:all .2s}
.dots i.on{background:#fff;transform:scale(1.15)}
.dots i.sm{width:5px;height:5px}
.ago{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:14px;background:#fff;color:var(--navy);font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(14,26,58,.12)}
.label{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:14px;color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.06em}
.vchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;background:rgba(14,26,58,.6);color:#fff;font-size:13px;font-weight:700}

/* ---------- feed ---------- */
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#5C7AD6}
#feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#fff}
.card .dots{top:calc(var(--top) + 116px)}
.scrim-top{position:absolute;left:0;right:0;top:0;height:200px;background:linear-gradient(rgba(14,26,58,.5),rgba(14,26,58,0));pointer-events:none}
.scrim-bot{position:absolute;left:0;right:0;bottom:0;height:64%;background:linear-gradient(to top,rgba(92,122,214,.9) 0%,rgba(104,134,222,.82) 30%,rgba(150,176,238,.42) 60%,rgba(190,208,248,0) 100%);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);-webkit-mask-image:linear-gradient(to top,#000 40%,transparent);mask-image:linear-gradient(to top,#000 40%,transparent);pointer-events:none}
.info,.rail{text-shadow:0 1px 10px rgba(20,40,110,.45)}
.rail{position:absolute;right:12px;bottom:calc(var(--tabspace) + 22px);display:flex;flex-direction:column;align-items:center;gap:14px;z-index:3}
.rail button{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.rail svg{width:25px;height:25px}
.info{position:absolute;left:16px;right:76px;bottom:calc(var(--tabspace) + 12px);display:flex;flex-direction:column;gap:5px;z-index:3;text-align:left}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.fprice{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.fprice small{font-size:20px;font-weight:700;letter-spacing:-.01em}
.fspec{font-size:16px;font-weight:600}
.fspec b{opacity:.5;font-weight:400;margin:0 5px}
.faddr{font-size:15px;color:#DCE4F7}
.fby{font-size:13px;color:#AEB8D3;display:flex;align-items:center;gap:6px}
.fby .more{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:#fff;font-weight:700;font-size:14px}
.burst{position:absolute;left:50%;top:42%;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;opacity:0;z-index:4}
.burst.go{animation:burst .8s ease-out}
@keyframes burst{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.1)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25) translateY(-30px)}}
.hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;background:rgba(14,26,58,.82);color:#fff;border-radius:20px;padding:14px 18px;font-size:14px;line-height:1.5;text-align:center;width:min(300px,80%);transition:opacity .4s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hint.gone{opacity:0;pointer-events:none}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center}
.empty h3{margin:0;font-family:'Bricolage Grotesque';font-size:26px}
.empty p{margin:0;line-height:1.5;opacity:.75}
#feed .empty{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:25px;font-weight:800;font-size:16px}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(45,91,255,.35)}.btn.white{background:#fff;color:var(--navy)}.btn.ghost{background:var(--sky);color:var(--navy)}

/* ---------- map ---------- */
#mapwrap{position:absolute;inset:0;background:#EEF2F8}
#map{position:absolute;inset:0}
#drawlayer{position:absolute;inset:0;z-index:10;touch-action:none;display:none}
#drawlayer.on{display:block}
.pin{padding:6px 10px;border-radius:13px;background:var(--blue);color:#fff;font:800 13px/1.12 'DM Sans',sans-serif;text-align:center;white-space:nowrap;box-shadow:0 3px 10px rgba(14,26,58,.28);cursor:pointer;transition:transform .15s}
.pin::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--blue)}
.pin small{display:block;font-size:11px;font-weight:700}
.pin.seen{background:#C2D0FF;color:var(--navy)}.pin.seen::after{border-top-color:#C2D0FF}
.pin.dim{background:#fff;color:var(--mute);box-shadow:0 0 0 1px rgba(14,26,58,.14)}.pin.dim::after{border-top-color:#fff}
.pin.sel{background:var(--navy);color:#fff;transform:scale(1.12)}.pin.sel::after{border-top-color:var(--navy)}
.pin.saved::before{content:'';position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--love);border:2px solid #fff}
.mtools{position:absolute;left:14px;bottom:calc(var(--tabspace) + 80px);display:flex;gap:10px;z-index:24}
.mtool{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.mtool.on{background:var(--blue)}
.mtool svg{width:24px;height:24px}
.savesearch{position:absolute;right:14px;bottom:calc(var(--tabspace) + 80px);z-index:24;height:54px;padding:0 24px;border-radius:27px;background:var(--blue);color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 22px rgba(45,91,255,.4)}
.savesearch.done{background:var(--navy);box-shadow:var(--shadow)}
.drawhint{position:absolute;left:14px;right:14px;top:calc(var(--top) + 116px);z-index:28;background:var(--blue);color:#fff;border-radius:18px;padding:12px 14px 12px 16px;font-weight:700;display:none;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 22px rgba(45,91,255,.35)}
.drawhint.on{display:flex}
.drawhint button{height:36px;padding:0 14px;border-radius:18px;background:#fff;color:var(--navy);font-weight:800}
.mapbtn{position:absolute;left:50%;bottom:calc(var(--tabspace) + 14px);transform:translate(-50%,20px);z-index:29;height:48px;padding:0 20px;border-radius:24px;background:var(--navy);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(14,26,58,.3);opacity:0;pointer-events:none;transition:all .25s}
.mapbtn.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.msheet{position:absolute;left:0;right:0;bottom:0;height:calc(100% - var(--top) - 120px);background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(14,26,58,.14);z-index:26;transform:translateY(calc(100% - 66px - var(--tabspace)));transition:transform .32s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column}
.msheet.open{transform:translateY(0)}
.msheet.drag{transition:none}
.mhead{flex:none;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;touch-action:none;cursor:grab}
.mhead .grab{width:42px;height:5px;border-radius:3px;background:rgba(14,26,58,.2)}
.mhead b{font-size:18px}
.mlist{flex:1;overflow-y:auto;padding:4px 14px calc(var(--tabspace) + 16px);-webkit-overflow-scrolling:touch}
.peek{position:absolute;left:12px;right:12px;bottom:calc(var(--tabspace) + 78px);z-index:27;background:#fff;border-radius:22px;padding:10px;box-shadow:0 12px 34px rgba(14,26,58,.22);display:none;gap:12px;align-items:center;text-align:left}
.peek.on{display:flex}
.thumb{flex:none;width:96px;height:96px;border-radius:16px;overflow:hidden;position:relative;background:#C9D3E6}
.peek .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.peek .p{font-family:'Bricolage Grotesque';font-weight:800;font-size:23px;letter-spacing:-.02em}
.peek .p small{font-size:14px}
.peek .s{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek .a{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek .heart{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;align-self:flex-start}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:calc(var(--tabspace) + 60px)}
.maplibregl-ctrl-attrib{font-size:10px}

/* ---------- list cards (map sheet + saved) ---------- */
.lcard{display:block;width:100%;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 6px 20px rgba(14,26,58,.06);margin-bottom:16px;text-align:left}
.lphoto{position:relative;height:220px}
.lphoto .dots{bottom:12px}
.lphoto .ago,.lphoto .label{position:absolute;top:12px;left:12px;z-index:3}
.lphoto .label{top:46px}
.lheart{position:absolute;top:8px;right:8px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;z-index:3}
.lheart svg{width:32px;height:32px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.lbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.lprice{display:flex;align-items:baseline;gap:8px}
.lprice b{font-family:'Bricolage Grotesque';font-weight:800;font-size:28px;letter-spacing:-.02em}
.lprice span{font-size:13px;color:var(--mute);font-weight:600}
.lspec{font-size:16px}.lspec i{font-style:normal;color:#AEB8D3;margin:0 6px}
.laddr{font-size:15px;color:var(--ink2)}
.lby{font-size:13px;color:var(--mute)}

/* ---------- pages ---------- */
.page{position:absolute;inset:0;overflow-y:auto;background:var(--paper);padding:calc(var(--top) + 10px) 16px calc(var(--tabspace) + 20px)}
.page h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;letter-spacing:-.02em;margin:6px 0 16px}
.box{background:#fff;border-radius:22px;padding:16px;box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:16px}
.box p{margin:0;color:var(--ink2);line-height:1.5;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-of-type{border-top:0}

/* ---------- sheets ---------- */
.veil{position:fixed;inset:0;background:rgba(14,26,58,.45);z-index:180;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:181;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:rgba(14,26,58,.18);margin:0 auto 14px}
.sheet h2{font-family:'Bricolage Grotesque';font-size:24px;margin:0 0 14px}
.field{margin-bottom:18px}
.field label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.field label span{color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--blue)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{height:40px;padding:0 16px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px rgba(14,26,58,.14);font-weight:700;font-size:14px}
.opt.on{background:var(--navy);color:#fff;box-shadow:none}
.menu button{display:flex;width:100%;align-items:center;gap:12px;padding:14px 4px;font-size:16px;font-weight:600;border-top:1px solid var(--line)}
.menu button:first-child{border-top:0}

/* ---------- detail ---------- */

const slidesHtml=h=>h.media.map(k=>`<div class="slide${h.video?' kenburns':''}">${art(k,h.pal)}</div>`).join('');

const tagsHtml=(h,dark)=>`${h.ago?`<span class="ago">${h.ago}</span>`:''}${h.label?`<span class="label" style="background:${LABELS[h.label]||'#fff'}">${h.label}</span>`:''}${h.video?`<span class="vchip"><svg width="11" height="11" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l13 8-13 8z"/></svg>Video tour</span>`:''}`;
function wireDots(root){
  root.querySelectorAll('[data-slides]').forEach(sl=>{ if(sl._w)return; sl._w=1;
    sl.addEventListener('scroll',()=>{const i=Math.round(sl.scrollLeft/sl.clientWidth);const d=sl.parentElement.querySelectorAll('.dots i');d.forEach((x,j)=>x.classList.toggle('on',j===i));},{passive:true});
  });
}

/* ---------- header (search + chips), shared by Discover and Map ---------- */
function activeFilters(){let n=0;if(S.max[S.mode]<DEF[S.mode])n++;if(S.beds)n++;if(S.areas.length)n++;return n;}
function renderHeader(){
  const n=activeFilters();
  const loc=S.areas.length?`Amsterdam · ${S.areas.length} drawn area${S.areas.length>1?'s':''}`:'Amsterdam, Netherlands';
  const priceOn=S.max[S.mode]<DEF[S.mode];
  const chips=[
    `<button class="fchip on" data-chip="mode">${S.mode==='rent'?'For rent':'For sale'}${ICON.chev}</button>`,
    priceOn?`<button class="fchip on" data-chip="price"><span class="xx" data-clear="price">${ICON.x}</span>Up to ${kShort(S.max[S.mode],S.mode)}${S.mode==='rent'?'/mo':''}${ICON.chev}</button>`:`<button class="fchip" data-chip="price">Price${ICON.chev}</button>`,
    S.beds?`<button class="fchip on" data-chip="beds"><span class="xx" data-clear="beds">${ICON.x}</span>${S.beds}+ bedrooms${ICON.chev}</button>`:`<button class="fchip" data-chip="beds">Bedrooms${ICON.chev}</button>`,
    S.areas.length?`<button class="fchip on" data-chip="area"><span class="xx" data-clear="area">${ICON.x}</span>Drawn area${S.areas.length>1?'s':''}</button>`:`<button class="fchip" data-chip="area">Draw area</button>`
  ].join('');
  $$('[data-hdr]').forEach(el=>{el.innerHTML=`<div class="searchrow"><button class="search" data-chip="search">${ICON.search}<span class="loc">${loc}</span>${S.areas.length?`<span class="clr" data-clear="area">${ICON.x}</span>`:''}</button><button class="filterbtn" data-chip="filters" aria-label="Filters">${ICON.sliders}${n?`<span class="cnt">${n}</span>`:''}</button></div><div class="chips">${chips}</div>`;});
  const b=$('#savedbadge');b.style.display=S.saved.size?'flex':'none';b.textContent=S.saved.size;
}
document.addEventListener('click',e=>{
  const fo=e.target.closest('[data-follow]');if(fo){e.stopPropagation();toggleFollow(fo.dataset.follow);return;}
  const cl=e.target.closest('[data-close]');if(cl){hideOv(cl.dataset.close);return;}
  const gp=e.target.closest('[data-gopane]');if(gp){setPane(gp.dataset.gopane,true);return;}
  const ac=e.target.closest('[data-acc]');if(ac){if(ST)closeStory();openAcc(ac.dataset.acc);return;}
  const bd=e.target.closest('[data-board]');if(bd){openBoardSheet(bd.dataset.board);return;}
  const lk=e.target.closest('[data-like]');if(lk){toggleLike(lk.dataset.like);return;}
  const ps=e.target.closest('[data-pshare]');if(ps){sharePost(postById[ps.dataset.pshare]);return;}
  const hs=e.target.closest('[data-hshare]');if(hs){share(byId[hs.dataset.hshare]);return;}
  const op=e.target.closest('[data-openpost]');if(op){openPostView(op.dataset.openpost);return;}
  const sy=e.target.closest('[data-story]');if(sy){openStory(sy.dataset.story);return;}
  const bo=e.target.closest('[data-boardopen]');if(bo){openBoard(bo.dataset.boardopen);return;}
  if(e.target.closest('[data-newboard]')){openBoardSheet(null);return;}
  const clr=e.target.closest('[data-clear]');
  if(clr){e.stopPropagation();const k=clr.dataset.clear;if(k==='price')S.max[S.mode]=DEF[S.mode];if(k==='beds')S.beds=0;if(k==='area')S.areas=[];persist();refresh();return;}
  const c=e.target.closest('[data-chip]');
  if(c){const k=c.dataset.chip;
    if(k==='mode'){S.mode=S.mode==='rent'?'buy':'rent';persist();refresh();toast(S.mode==='rent'?'Showing homes for rent':'Showing homes for sale');}
    else if(k==='area'){go('map');setTimeout(()=>setDrawing(true),250);}
    else openFilters();
    return;}
  const t=e.target.closest('[data-tab]');if(t){go(t.dataset.tab);return;}
  const o=e.target.closest('[data-open]');if(o&&!e.target.closest('[data-heart]')){openDetail(byId[o.dataset.open]);return;}
  const hh=e.target.closest('[data-heart]');if(hh){toggleSave(hh.dataset.heart);return;}
});

/* ---------- Discover feed ---------- */
function renderFeed(){
  const list=results(),feed=$('#feed');
  if(!list.length){feed.innerHTML=`<div class="empty"><h3>No homes here yet</h3><p>Nothing matches ${S.areas.length?'inside your drawn area':'these filters'} right now.</p>${S.areas.length?'<button class="btn white" data-clear="area">Clear drawn area</button>':''}<button class="btn blue" data-chip="filters">Change filters</button></div>`;return;}
  feed.innerHTML=list.map(h=>{const sv=S.saved.has(h.id);return `<article class="card" data-id="${h.id}">
    <div class="slides" data-slides>${slidesHtml(h)}</div>
    <div class="scrim-top"></div><div class="scrim-bot"></div>${dotsHtml(h)}
    <svg class="burst" viewBox="0 0 24 24" fill="#FF5C8A"><path d="M12 20.5s-7.5-4.6-9.5-9.2C1.2 8.1 3.3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.5 0 5.6 3.6 4.3 6.8-2 4.6-9.5 9.2-9.5 9.2z"/></svg>
    <div class="rail">${h.acc?railAvatar(h.acc):''}<button data-act="save" aria-label="Save">${ICON.heart(sv?'#FF5C8A':'none',sv?'#FF5C8A':'#fff')}</button><button data-board="h:${h.id}" aria-label="Save to board">${ICON.bm(inBoards('h:'+h.id),'#fff')}</button><button data-act="share" aria-label="Share">${ICON.share('#fff')}</button><button data-act="more" aria-label="More">${ICON.more('#fff')}</button></div>
    <button class="info" data-act="detail"><div class="tags">${tagsHtml(h)}</div>
      <div class="fprice">${money(h.price)}<small>${per(h)}</small></div>
      <div class="fspec">${specHtml(h).replace(/<i>/g,'<b>').replace(/<\/i>/g,'</b>')}</div>
      <div class="faddr">${addr(h)}</div>
      <div class="fby"><span>${by(h)}</span><span class="more">Details<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>
    </button></article>`;}).join('');
  wireDots(feed);
}
$('#feed').addEventListener('scroll',()=>$('#hint').classList.add('gone'),{passive:true,once:true});
setTimeout(()=>$('#hint').classList.add('gone'),6000);
let lastTap={t:0,id:null};
$('#feed').addEventListener('click',e=>{
  const card=e.target.closest('.card'),act=e.target.closest('[data-act]');
  if(!card||e.target.closest('[data-acc],[data-follow],[data-board]'))return;
  const h=byId[card.dataset.id];
  if(act){const a=act.dataset.act;if(a==='save')toggleSave(h.id);if(a==='share')share(h);if(a==='more')openMore(h);if(a==='detail')openDetail(h);return;}
  const now=Date.now();
  if(now-lastTap.t<320&&lastTap.id===h.id){if(!S.saved.has(h.id))toggleSave(h.id);const b=card.querySelector('.burst');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');lastTap={t:0,id:null};}
  else lastTap={t:now,id:h.id};
});
function toggleSave(id){
  if(S.saved.has(id)){S.saved.delete(id);toast('Removed from saved');}else{S.saved.add(id);toast('Saved ♥');vibrate();}
  persist();syncHeart(id);
}
function syncHeart(id){
  const on=S.saved.has(id);
  $$(`.card[data-id="${id}"] [data-act="save"]`).forEach(b=>{b.innerHTML=ICON.heart(on?'#FF5C8A':'none',on?'#FF5C8A':'#fff');});
  $$(`[data-heart="${id}"]`).forEach(b=>{b.innerHTML=b.classList.contains('heart')?ICON.heart(on?'#FF5C8A':'none',on?'#FF5C8A':'#2D5BFF',22):b.classList.contains('aheart')?ICON.heart(on?'#FF5C8A':'none',on?'#FF5C8A':'#0E1A3A'):ICON.heart(on?'#FF5C8A':'rgba(14,26,58,.25)','#fff');});
  renderHeader();if(S.tab==='saved')renderSaved();if(mapReady)renderPins();if($('#detail').classList.contains('on'))syncDetailSave(id);
}
function share(h){const text=`${money(h.price)}${per(h)} · ${addr(h)} (Dooro)${h.url?' '+h.url:''}`;
  const copy=()=>{try{navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard'),()=>toast(text))}catch(e){toast(text)}};
  if(navigator.share)navigator.share({title:'Dooro',text}).catch(err=>{if(!err||err.name!=='AbortError')copy();});else copy();}

/* ---------- sheets ---------- */
function openSheet(id){$('#veil').classList.add('on');$('#'+id).classList.add('on');}
function closeSheets(){$('#veil').classList.remove('on');$$('.sheet').forEach(s=>s.classList.remove('on'));}
$('#veil').addEventListener('click',closeSheets);
function openFilters(){
  const rent=S.mode==='rent',[min,max,step]=rent?C.rentRange:C.buyRange,val=Math.min(S.max[S.mode],max);
  const lbl=v=>rent?money(+v)+' /month':money(+v);
  $('#filters').innerHTML=`<div class="grab"></div><h2>Filters</h2>
    <div class="field"><label>Looking to</label><div class="opts">${['rent','buy'].map(m=>`<button class="opt ${S.mode===m?'on':''}" data-fmode="${m}">${m==='rent'?'Rent':'Buy'}</button>`).join('')}</div></div>
    <div class="field"><label>${rent?'Max rent':'Max price'} <span id="maxv">${lbl(val)}</span></label><input type="range" id="maxr" min="${min}" max="${max}" step="${step}" value="${val}"></div>
    <div class="field"><label>Bedrooms</label><div class="opts">${[0,1,2,3].map(b=>`<button class="opt ${S.beds===b?'on':''}" data-beds="${b}">${b?b+'+':'Any'}</button>`).join('')}</div></div>
    <button class="btn blue" style="width:100%" id="applyf">Show ${results().length} homes</button>`;
  const upd=()=>{$('#applyf').textContent=`Show ${results().length} homes`;};
  $('#maxr').addEventListener('input',e=>{S.max[S.mode]=+e.target.value;$('#maxv').textContent=+e.target.value>=max?'Any':lbl(e.target.value);upd();});
  $('#filters').onclick=e=>{
    const fm=e.target.closest('[data-fmode]');if(fm){S.mode=fm.dataset.fmode;persist();refresh();openFilters();return;}
    const bd=e.target.closest('[data-beds]');if(bd){S.beds=+bd.dataset.beds;$$('[data-beds]').forEach(c=>c.classList.toggle('on',c===bd));upd();return;}
    if(e.target.id==='applyf'){persist();refresh();closeSheets();}
  };
  openSheet('filters');
}

/* ---------- static map (private page: no external tiles allowed) ---------- */
const SM={ready:false,s:1,tx:0,ty:0,smin:1,pts:new Map(),moved:false};
const merc=lat=>Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
function smProj(lng,lat){const m=C.staticMap,b=m.bounds;return[(lng-b.west)/(b.east-b.west)*m.w,(merc(b.north)-merc(lat))/(merc(b.north)-merc(b.south))*m.h];}
function smUnproj(x,y){const m=C.staticMap,b=m.bounds;const sx=(x-SM.tx)/SM.s,sy=(y-SM.ty)/SM.s;const mm=merc(b.north)-sy/m.h*(merc(b.north)-merc(b.south));return[b.west+sx/m.w*(b.east-b.west),(2*Math.atan(Math.exp(mm))-Math.PI/2)*180/Math.PI];}
function smInit(){
  const m=C.staticMap,wrap=$('#map');
  wrap.innerHTML=`<div id="stage" style="position:absolute;left:0;top:0;width:${m.w}px;height:${m.h}px;transform-origin:0 0"><img src="${m.src}" alt="" draggable="false" style="width:100%;height:100%;display:block;-webkit-user-drag:none"><svg id="areasvg" viewBox="0 0 ${m.w} ${m.h}" style="position:absolute;inset:0;width:100%;height:100%"></svg></div><div id="pinlayer" style="position:absolute;inset:0;pointer-events:none"></div><div style="position:absolute;right:6px;bottom:calc(var(--tabspace) + 70px);font-size:10px;color:#5B6684;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:4px">© OpenMapTiles © OpenStreetMap contributors</div>`;
  wrap.style.touchAction='none';
  wrap.addEventListener('pointerdown',e=>{SM.pts.set(e.pointerId,[e.clientX,e.clientY]);SM.moved=false;SM.last=null;});
  wrap.addEventListener('pointermove',e=>{
    if(!SM.pts.has(e.pointerId))return;const prev=SM.pts.get(e.pointerId);SM.pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(SM.pts.size===1){const dx=e.clientX-prev[0],dy=e.clientY-prev[1];if(Math.abs(dx)+Math.abs(dy)>2)SM.moved=true;SM.tx+=dx;SM.ty+=dy;}
    else if(SM.pts.size===2){const[a,b]=[...SM.pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;if(SM.last){smZoomAt(cx,cy,d/SM.last);}SM.last=d;SM.moved=true;}
    smApply();
  });
  const up=e=>{SM.pts.delete(e.pointerId);SM.last=null;if(!SM.moved&&!e.target.closest('.pin')&&SM.pts.size===0){S.selected=null;renderPins();renderPeek();}if(SM.moved)$('#msheet').classList.remove('open');};
  wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
  wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();smZoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12);smApply();},{passive:false});
  SM.ready=true;mapReady=true;smFit(false);renderPins();
}
function smZoomAt(cx,cy,f){const ns=Math.min(Math.max(SM.s*f,SM.smin),SM.smin*4);const k=ns/SM.s;SM.tx=cx-(cx-SM.tx)*k;SM.ty=cy-(cy-SM.ty)*k;SM.s=ns;}
function smApply(){
  const m=C.staticMap,wrap=$('#map'),vw=wrap.clientWidth,vh=wrap.clientHeight;
  SM.tx=Math.min(0,Math.max(vw-m.w*SM.s,SM.tx));SM.ty=Math.min(0,Math.max(vh-m.h*SM.s,SM.ty));
  $('#stage').style.transform=`translate(${SM.tx}px,${SM.ty}px) scale(${SM.s})`;
  $$('#pinlayer .pin').forEach(el=>{const[x,y]=el._xy;el.style.left=(SM.tx+x*SM.s)+'px';el.style.top=(SM.ty+y*SM.s)+'px';});
}
function smFit(){
  const m=C.staticMap,wrap=$('#map'),vw=wrap.clientWidth||innerWidth,vh=wrap.clientHeight||innerHeight;
  SM.smin=Math.max(vw/m.w,vh/m.h);
  const xy=HOMES.filter(matches).map(h=>smProj(h.lng,h.lat));
  if(!xy.length){SM.s=SM.smin;SM.tx=(vw-m.w*SM.s)/2;SM.ty=(vh-m.h*SM.s)/2;smApply();return;}
  const xs=xy.map(p=>p[0]),ys=xy.map(p=>p[1]),bw=Math.max(...xs)-Math.min(...xs)+1,bh=Math.max(...ys)-Math.min(...ys)+1;
  const top=170,bot=240,side=60;SM.s=Math.min(Math.max(Math.min((vw-2*side)/bw,(vh-top-bot)/bh),SM.smin),SM.smin*4);
  const cx=(Math.max(...xs)+Math.min(...xs))/2,cy=(Math.max(...ys)+Math.min(...ys))/2;
  SM.tx=vw/2-cx*SM.s;SM.ty=top+(vh-top-bot)/2-cy*SM.s;smApply();
}
function smPins(){
  const layer=$('#pinlayer');if(!layer)return;layer.innerHTML='';
  HOMES.filter(matches).forEach(h=>{const el=pinEl(h);el._xy=smProj(h.lng,h.lat);el.style.position='absolute';el.style.pointerEvents='auto';el.style.translate='-50% calc(-100% - 6px)';layer.appendChild(el);});
  $('#areasvg').innerHTML=S.areas.map(a=>`<polygon points="${a.map(p=>smProj(p[0],p[1]).join(',')).join(' ')}" fill="#2D5BFF" fill-opacity=".14" stroke="#2D5BFF" stroke-width="3.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join('');
  smApply();
}

function setDrawing(on){

const agoMin=s=>{if(!s)return 99999;const m=/(\d+)\s*(min|hour|day|week)/i.exec(s);if(!m)return /now|today|just/i.test(s)?0:99999;return +m[1]*({min:1,hour:60,day:1440,week:10080}[m[2].toLowerCase()]);};

function openBoard(id,shared,keep){
  const b=shared||S.boards.find(x=>x.id===id);if(!b)return;boardOpen=shared?{...b,shared:true}:b;
  $('#boardv').innerHTML=`<div class="ovtop"><button class="ovb" data-close="boardv" aria-label="Back">${ICON.back}</button><div class="ovt">${esc(b.name)}</div><button class="ovb" id="bshare" aria-label="Share board">${ICON.share('#0E1A3A')}</button></div>
    <div class="ovbody">${shared?`<div class="box" style="text-align:center"><h3>Shared with you</h3><p>Someone sent you this Dooro board.</p><button class="btn blue" id="bkeep" style="margin-top:12px">Save to my boards</button></div>`:''}
      <p class="note" style="margin:0 0 12px">${b.items.length} saved${shared?'':' · share it with one link'}</p>
      ${b.items.length?`<div class="bitems">${b.items.map(k=>`<button class="bitem" ${itemAttr(k)}><div class="bimg">${itemArt(k)}</div><span>${itemCap(k)}</span></button>`).join('')}</div>`:`<div class="box" style="text-align:center;padding:28px 18px"><p>Nothing here yet. Tap the bookmark on any home or post to add it.</p></div>`}
      ${shared?'':`<button class="btn ghost" style="width:100%;margin-top:22px" id="bdel">Delete board</button>`}</div>`;
  if(keep){wireDots($('#boardv'));}else showOv('boardv');
  $('#bshare').onclick=()=>shareBoard(b);
  if(shared)$('#bkeep').onclick=()=>{const nb={id:'b'+Date.now().toString(36),name:b.name,items:[...b.items]};S.boards.unshift(nb);nb.items.forEach(addHomeToSaved);persist();toast('Board saved to your boards');openBoard(nb.id,null,true);if(S.tab==='saved')renderSaved();};
  else $('#bdel').onclick=()=>{if(confirm(`Delete the board “${b.name}”?`)){const ks=b.items;S.boards=S.boards.filter(x=>x!==b);persist();hideOv('boardv');ks.forEach(k=>boardsChanged(k));renderSaved();toast('Board deleted');}};
}
function shareBoard(b){
  let url=location.origin+location.pathname;
  try{url+='?board='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({n:b.name,i:b.items})))));}catch(e){}
  const copy=()=>{try{navigator.clipboard.writeText(url).then(()=>toast('Board link copied'),()=>toast(url))}catch(e){toast(url)}};
  if(navigator.share)navigator.share({title:`Dooro board: ${b.name}`,text:`My Dooro board “${b.name}” (${b.items.length} homes)`,url}).catch(err=>{if(!err||err.name!=='AbortError')copy();});else copy();
}
function openSharedBoardFromUrl(){
  try{const q=new URLSearchParams(location.search).get('board');if(!q)return;
    const d=JSON.parse(decodeURIComponent(escape(atob(q))));
    history.replaceState(null,'',location.pathname);
    if(!d||!Array.isArray(d.i))return;
    const items=d.i.filter(k=>typeof k==='string'&&itemOf(k)).slice(0,60);
    setTimeout(()=>openBoard(null,{id:'shared',name:String(d.n||'Shared board').slice(0,40),items}),1250);
  }catch(e){}
}

/* ---------- the three Discover feeds ---------- */
const PANES=['following','foryou','explore'];
function onPane(p){
  S.pane=p;$('#v-feed').dataset.pane=p;
  $$('.ftab').forEach(b=>b.classList.toggle('on',b.dataset.gopane===p));
  if(p==='following'&&(S.folDirty||!$('#fol').children.length))renderFollowing();
  if(p!=='foryou')$('#hint').classList.add('gone');
  themeTabs();
}
function setPane(p,smooth){const pg=$('#pager'),i=PANES.indexOf(p);pg.scrollTo({left:i*pg.clientWidth,behavior:smooth?'smooth':'auto'});if(!smooth||S.pane!==p)onPane(p);}
function themeTabs(){const dark=S.tab==='feed'&&S.pane!=='following';$('#tabs').className=dark?'dark':'light';const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=dark?'#0E1A3A':'#F6F8FF';}
function paneFromScroll(){const pg=$('#pager'),i=Math.round(pg.scrollLeft/Math.max(1,pg.clientWidth));if(PANES[i]&&PANES[i]!==S.pane)onPane(PANES[i]);}
let paneT;$('#pager').addEventListener('scroll',()=>{paneFromScroll();clearTimeout(paneT);paneT=setTimeout(paneFromScroll,140);},{passive:true});
$('#pager').addEventListener('scrollend',paneFromScroll);
addEventListener('resize',()=>{if(S.tab==='feed')setPane(S.pane,false);});
wireDoubleTap($('#xfeed'));wireDoubleTap($('#postv'));

/* ---------- navigation ---------- */
function go(tab){
  S.tab=tab;closeSheets();closeDetail();closeOverlays();if(S.drawing)setDrawing(false);
  $$('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+tab));
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  themeTabs();if(tab==='feed')requestAnimationFrame(()=>setPane(S.pane,false));
  if(tab==='map'){initMap();if(map)setTimeout(()=>map.resize(),30);renderSheet();}
  if(tab==='saved')renderSaved();if(tab==='profile')renderProfile();
}
function refresh(){renderHeader();renderFeed();if(mapReady)renderPins();renderSheet();if(S.tab==='saved')renderSaved();if(S.tab==='profile')renderProfile();}

refresh();renderExplore();renderFollowing();requestAnimationFrame(()=>setPane(S.pane,false));openSharedBoardFromUrl();
if(!C.staticMap&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
